<div class="voice-mode-container">
  <button class="back-btn" (click)="backToChat()">⬅ Back to Chat</button>

  <div class="mic-status">
    <span class="pulse" *ngIf="isListening"></span>
    <p>{{ isListening ? 'Listening...' : 'Processing...' }}</p>
  </div>

  <div class="transcript-box">
    <p *ngIf="transcript; else waiting">🗣️ {{ transcript }}</p>
    <ng-template #waiting>
      <p class="placeholder">Say something...</p>
    </ng-template>
  </div>
</div>
