<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>

<div class="parent">
  <div class="container">
    <div class="form-container">
      <div class="requests-container">
        <div class="main-content">
          <h2 class="title">Doctor Verification Requests</h2>
          <div class="requests-table">
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th class="rid">Request Id</th>
                    <th class="rrid">Id</th>
                    <th class="time">Date & Time</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let request of requests">
                    <td class="tdid">{{ request.id }}</td>
                    <td class="time">{{ request.requestedAtUtc | date:'medium' }}</td>
                    <td>
                      <span class="status-badge" [ngClass]="getStatusName(request.status)">
                        {{ getStatusName(request.status) }}
                      </span>
                    </td>
                    <td>
                      <div class="action-buttons">
                        <button class="icon-button view-btn">
                          <span>View</span>
                          <i class="fas fa-eye"></i>
                        </button>
                        <button *ngIf="(request.status===status.Pending)&&(!isTimeExpired(request.requestedAtUtc))" (click)="promptDelete(request.id,request.requestedAtUtc,request.status)" class="icon-button delete-btn">
                          <span>Delete</span>
                          <i class="fas fa-trash-alt"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <button *ngIf="!ispending" class="add-request" type="button" (click)="addRequest()">Add Request</button>
          <button *ngIf="ispending" class="add-request" type="button" disabled>Add Request</button>

          <!-- Confirm Delete Modal -->
          <div *ngIf="showConfirmModal" class="modal-overlay">
            <div class="modal-box">
              <h3 class="modal-title">Delete Verification Request?</h3>
              <p class="modal-message">Are you sure you want to delete this Verification Request? This action cannot be undone.</p>
              <div class="modal-actions">
                <button (click)="cancelDelete()" class="cancel-button">Cancel</button>
                <button (click)="deleteRequest()" class="delete-button">Delete</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
