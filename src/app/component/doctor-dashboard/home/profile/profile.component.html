<div class="profile-container">
  <app-sidebar></app-sidebar>

  <div class="main-content">
    <div class="profile-card">
      <div class="profile-left">
        <img src="images/Male-Therapist.jpg" alt="Doctor Profile" class="profile-image" />
        <label for="imageUpload" class="upload-btn">Change Photo</label>
        <input type="file" id="imageUpload" hidden />
      </div>

      <div class="profile-right">
        <form (ngSubmit)="onSubmit()" #profileForm="ngForm">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" [(ngModel)]="doctor.name" name="name" required />
          </div>

          <div class="form-group">
            <label>Degree</label>
            <input type="text" [(ngModel)]="doctor.degree" name="degree" required />
          </div>

          <div class="form-group">
            <label>Experience (Years)</label>
            <input type="number" [(ngModel)]="doctor.experience" name="experience" min="0" required />
          </div>

          <div class="form-group">
            <label>About</label>
            <textarea [(ngModel)]="doctor.about" name="about" rows="4" required></textarea>
          </div>

          <div class="form-group">
            <label>Appointment Fee ($)</label>
            <input type="number" [(ngModel)]="doctor.fee" name="fee" required />
          </div>

          <div class="form-group">
            <label>Address</label>
            <textarea [(ngModel)]="doctor.address" name="address" rows="2" required></textarea>
          </div>

          <div class="form-group inline-group">
            <label>
              <input type="checkbox" [(ngModel)]="doctor.available" name="available" />
              Available
            </label>
          </div>

          <button type="submit" class="save-btn">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
