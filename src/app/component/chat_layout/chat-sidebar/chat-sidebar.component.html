<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />

<div class="flex h-screen">
  <!-- Sidebar -->
  <aside
    [class.w-64]="isSidebarOpen"
    [class.w-16]="!isSidebarOpen"
    class="bg-gray-900 text-white transition-all duration-300 overflow-hidden flex flex-col"
  >
    <!-- Top Section -->
    <header class="flex items-center justify-between p-4 pt-6 h-12">
      <span class="text-xl font-semibold" [class.hidden]="!isSidebarOpen">Seravian</span>
      <div class="flex items-center gap-3">
        <button *ngIf="isSidebarOpen" class="text-white hover:text-gray-300" (click)="onSearchClick()">
          <span class="material-symbols-rounded text-2xl relative top-[2px]">search</span>
        </button>
        <button class="text-white hover:text-gray-300" (click)="toggleSidebar()">
          <span class="material-symbols-rounded text-2xl relative top-[2px]">menu</span>
        </button>
      </div>
    </header>

    <!-- Search Input -->
    <section *ngIf="isSidebarOpen && isSearchOpen" class="px-4 pt-2 mb-4">
      <input
        type="text"
        placeholder="Search..."
        class="w-full p-2 rounded bg-gray-800 text-white placeholder-gray-400 focus:outline-none"
      />
    </section>

    <!-- New Chat Button -->
    <button
  class="w-full flex items-center gap-3 bg-gray-800 hover:bg-gray-700 text-white p-4 transition-all mb-5"
  (click)="createNewChat()"
>
      <span class="material-symbols-rounded">add</span>
      <span *ngIf="isSidebarOpen">New Chat</span>
    </button>

    <!-- Chat Tabs -->
    <nav class="flex-1 overflow-y-auto">
      <ul>
        <li *ngFor="let chat of chats">
          <div
            class="group flex items-center justify-between gap-2 px-4 py-2 cursor-pointer transition"
            [class.bg-gray-700]="selectedChatId === chat.id"
            (click)="selectChat(chat.id)"
          >
            <div class="flex items-center gap-3 flex-grow">
              <span class="material-symbols-rounded">chat</span>

              <span *ngIf="!chat.isEditing && isSidebarOpen" class="truncate">{{ chat.title }}</span>

              <input
                *ngIf="chat.isEditing"
                type="text"
                [(ngModel)]="chat.title"
                class="bg-gray-700 text-white p-2 rounded focus:outline-none"
                (blur)="renameChat(chat)"
                (keydown.enter)="renameChat(chat)"
                #inputField
              />
            </div>

            <!-- 3-dot menu -->
            <div *ngIf="isSidebarOpen && !chat.isEditing" class="relative flex-shrink-0">
              <button class="text-white z-0 relative dropdown-trigger" (click)="toggleDropdown(chat.id)">
                <span class="material-symbols-rounded">more_vert</span>
              </button>
              <div
                *ngIf="dropdownVisible === chat.id"
                class="absolute right-0 mt-2 w-32 bg-gray-800 text-white rounded shadow-lg z-10 dropdown-menu"
              >
                <button
                  class="w-full text-left px-4 py-2 text-sm hover:bg-gray-700"
                  (click)="startRename(chat)"
                >
                  Rename
                </button>
                <button
                  class="w-full text-left px-4 py-2 text-sm hover:bg-gray-700"
                  (click)="promptDelete(chat.id)"
                >
                  Delete
                </button>
              </div>
            </div>
          </div>
        </li>
      </ul>
    </nav>

    <!-- Footer -->
    <footer class="p-4 border-t border-gray-700">
      <button class="w-full text-left flex items-center gap-3 hover:bg-gray-700 p-2 rounded">
        <span class="material-symbols-rounded">logout</span>
        <span *ngIf="isSidebarOpen">Exit</span>
      </button>
    </footer>
  </aside>

  <!-- Confirm Delete Modal -->
  <div *ngIf="showConfirmModal" class="fixed inset-0 flex items-center justify-center z-50">
    <!-- Background Overlay -->
    <div class="absolute inset-0 bg-black opacity-50"></div>

    <!-- Modal Box -->
    <div class="relative bg-gray-800 text-white rounded-lg p-6 w-80 shadow-lg z-10">
      <h3 class="text-lg font-semibold mb-4">Delete chat?</h3>
      <p class="text-sm text-gray-300 mb-6">Are you sure you want to delete this chat? This action cannot be undone.</p>
      <div class="flex justify-end space-x-4">
        <button (click)="cancelDelete()" class="text-sm px-4 py-2 rounded hover:bg-gray-700">Cancel</button>
        <button (click)="confirmDelete()" class="text-sm px-4 py-2 bg-red-600 hover:bg-red-700 rounded">Delete</button>
      </div>
    </div>
  </div>
</div>
