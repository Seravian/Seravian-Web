<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sidebar Example</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
</head>
<body [class.sidebar-open]="isSidebarOpen" [class.sidebar-closed]="!isSidebarOpen">
  <div class="container">
    <aside class="sidebar" [class.sidebar-open]="isSidebarOpen" [class.sidebar-closed]="!isSidebarOpen">
      <!-- Top Section -->
      <header class="header">
        <span class="logo" [class.hidden]="!isSidebarOpen">Seravian</span>
        <div class="header-buttons">
          <button *ngIf="isSidebarOpen" class="icon-button" (click)="onSearchClick()">
            <span class="material-symbols-rounded icon">search</span>
          </button>
          <button class="icon-button" (click)="toggleSidebar()">
            <span class="material-symbols-rounded icon">menu</span>
          </button>
        </div>
      </header>

      <!-- Search Input -->
      <section *ngIf="isSidebarOpen && isSearchOpen" class="search-section">
        <input type="text" placeholder="Search..." class="search-input"/>
      </section>

      <!-- New Chat Button -->
       <div class="button-item">
        <button class="new-chat-button" (click)="createNewChat()">
          <span class="material-symbols-rounded">add</span>
          <span *ngIf="isSidebarOpen">New Chat</span>
        </button>
       </div>

      <!-- Chat Tabs -->
      <nav class="chat-list">
        <ul>
          <li *ngFor="let chat of chats">
            <div class="chat-item" [class.selected]="selectedChatId === chat.id" (click)="selectChat(chat.id)">
              <div class="chat-content">
                <span class="material-symbols-rounded">chat</span>

                <span *ngIf="!chat.isEditing && isSidebarOpen" class="truncate">{{ chat.title }}</span>

                <input *ngIf="chat.isEditing"
                  type="text"
                  [(ngModel)]="chat.title"
                  class="chat-edit-input"
                  (blur)="renameChat(chat)"
                  (keydown.enter)="renameChat(chat)"
                  #inputField
                />
              </div>

              <!-- Dropdown -->
              <div *ngIf="isSidebarOpen && !chat.isEditing" class="dropdown-wrapper">
                <button class="edit-button dropdown-trigger" (click)="toggleDropdown(chat.id)">
                  <span class="material-symbols-rounded">more_vert</span>
                </button>
                <div *ngIf="dropdownVisible === chat.id" class="dropdown-menu">
                  <button class="dropdown-item" (click)="startRename(chat)">Rename</button>
                  <button class="dropdown-item" (click)="promptDelete(chat.id)">Delete</button>
                </div>
              </div>
            </div>
          </li>
        </ul>
      </nav>

      <!-- Footer -->
      <footer class="sidebar-footer">
        <button class="footer-button">
          <span class="material-symbols-rounded">logout</span>
          <span *ngIf="isSidebarOpen">Exit</span>
        </button>
      </footer>
    </aside>

    <!-- Confirm Delete Modal -->
    <div *ngIf="showConfirmModal" class="modal-overlay">
      <div class="modal-box">
        <h3 class="modal-title">Delete chat?</h3>
        <p class="modal-message">Are you sure you want to delete this chat? This action cannot be undone.</p>
        <div class="modal-actions">
          <button (click)="cancelDelete()" class="cancel-button">Cancel</button>
          <button (click)="confirmDelete()" class="delete-button">Delete</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
